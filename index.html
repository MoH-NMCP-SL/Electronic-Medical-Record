<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6693">
<meta name="color-scheme" content="light">
<title>PHU EMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Dark theme built on the Okabe and Ito colour blind safe palette.
   State is never shown by colour alone: selected chips carry a tick,
   deaths carry the word "died", and every colour has a text label. */
:root{
  color-scheme:light;
  --bg:#eef2f6; --s1:#ffffff; --s2:#f7f9fb; --s3:#e6eef6; --line:#cfdbe7; --line2:#e3eaf1;
  --ink:#0b2540; --muted:#1565c0; --faint:#147cd7;
  --dhis:#2c6693; --dhis2:#1565c0; --dhis3:#0d47a1;
  --sky:#56B4E9; --orange:#E69F00; --green:#009E73; --yellow:#F0E442;
  --blue:#0072B2; --verm:#D55E00; --purple:#CC79A7; --on:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-weight:700;font:700 15px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select:disabled,input:disabled{opacity:1;color:#56B4E9;border-style:dashed;background-color:transparent}
input[type=date],input[type=time]{min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sky);box-shadow:0 0 0 3px rgba(86,180,233,.25)}
textarea{min-height:84px;resize:vertical}
::placeholder{color:#56B4E9;opacity:.85;font-weight:700}
option,optgroup{background:#18222d;color:#ffffff;font-weight:700}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
code,.mono{font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:96px}

/* ---------- top bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,17,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--sky);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em;flex:0 0 auto}
.ctxbtn{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.ctxbtn b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxbtn small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per{flex:0 0 auto;border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}

main{padding:14px 14px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.h{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ph{display:flex;align-items:baseline;gap:10px;margin:4px 2px 12px}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.lnk{color:var(--sky);font-weight:700;padding:6px 2px}
.lnk.danger{color:var(--verm);display:block;margin:6px auto 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--s3);color:var(--ink)}
.two{display:flex;flex-direction:column;gap:14px}
.fl>label,.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;background:var(--sky);color:var(--on);font-weight:700;font-size:15px;flex:1}
.btn.sec{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--verm);color:var(--on)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:13.5px;flex:0 0 auto}

/* ---------- chips / pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pl{border:1px solid var(--line);background:var(--s2);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14px;line-height:1.2;min-height:40px}
.pl.on{background:var(--sky);border-color:var(--sky);color:var(--on);font-weight:700}
.multi .pl.on{background:var(--yellow);border-color:var(--yellow);color:var(--on)}
.multi .pl.on::before{content:"✓ ";font-weight:700}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -14px;padding-left:14px;padding-right:14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pl{flex:0 0 auto}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border-radius:10px;padding:9px 8px;font-size:14px;font-weight:700;color:var(--muted);min-height:40px}
.seg button.on{background:var(--s3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--sky)}
.search{margin-bottom:10px}

/* ---------- register rows ---------- */
.rb{display:inline-grid;place-items:center;min-width:58px;height:44px;padding:0 6px;border-radius:12px;background:var(--c);color:var(--ct,#07121b);font-weight:700;font-size:12.5px;flex:0 0 auto}
.rb.sm{min-width:48px;height:30px;border-radius:9px;font-size:11.5px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line2)}
.rrow:last-child{border-bottom:0}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-size:15px}.rt small{color:var(--muted);font-size:12.5px}
.rt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:12px;font-weight:900;border-radius:6px;padding:3px 8px;background:#07121b;color:var(--yellow);border:1px solid var(--yellow)}
.tg.none{color:#CC79A7}
.rn{font-weight:700;color:var(--ink);font-size:13px;background:var(--s3);border-radius:999px;padding:2px 9px}
.chev{color:var(--faint);font-size:22px;line-height:1}

/* ---------- landing ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 20px 14px;margin:2px 0 6px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 100% 0%,rgba(86,180,233,.30),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(0,158,115,.24),transparent 60%),linear-gradient(160deg,#142131,#0e1722)}
.hero .hx{position:absolute;right:-40px;top:-30px;width:320px;height:220px;pointer-events:none}
.hero .hx circle{fill:none;stroke:rgba(86,180,233,.16);stroke-width:1.2}
.eyebrow{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(240,228,66,.18)}
.hero h1{position:relative;margin:12px 0 10px;font-size:32px;line-height:1.08;font-weight:900;letter-spacing:-.02em}
.hero p{position:relative;margin:0;color:#ffffff;font-weight:700;font-size:15px;max-width:34ch}
.hero .pulse{display:block;width:100%;height:40px;margin-top:14px}
.hero .pulse path{fill:none;stroke:var(--sky);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:ecg 2.2s ease-out .2s forwards}
@keyframes ecg{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero .pulse path{animation:none;stroke-dashoffset:0}}
.lh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin:22px 4px 10px}
.lh::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--yellow),transparent)}
.cards{display:flex;flex-direction:column;gap:12px}
.rcard{position:relative;overflow:hidden;display:flex;flex-direction:column;width:100%;text-align:left;padding:0;border-radius:22px;border:2px solid var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--s1)) 0%,var(--s1) 100%);transition:transform .12s ease,box-shadow .12s}
.rcard .pic{position:relative;display:block;aspect-ratio:2/1;overflow:hidden;background:var(--c)}
.rcard .art{display:block;width:100%;height:100%;object-fit:cover}
.rcard .pic::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 55%,#07121b))}
.rcard .age{position:absolute;left:12px;bottom:10px;z-index:1;background:var(--c);color:#07121b;font-weight:900;font-size:13px;border-radius:999px;padding:5px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rcard .rbody{display:flex;align-items:center;gap:14px;padding:14px 14px 16px}
.rcard .rt small{color:var(--c);font-weight:700}
.rcard:active{transform:scale(.985)}
.rcard:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
.rcard .rt b{font-size:16.5px}
.rb.big{min-width:64px;height:64px;border-radius:18px;font-size:14px}
.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#07121b;font-weight:900;font-size:20px;line-height:1;flex:0 0 auto}
.flt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.flt .fi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--s3);color:var(--sky);font-size:18px;flex:0 0 auto}
input.auto{background:transparent;border-style:dashed;color:var(--muted)}
/* ---------- home ---------- */
.fn{font-size:20px;font-weight:700;margin-top:2px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.br .bt{grid-column:1/-1;height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.br .bt i{display:block;height:100%;background:var(--sky);border-radius:4px}
.br b{font-weight:700}

/* ---------- records ---------- */
.rec{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.rec .rm{flex:1;min-width:0}
.rec .l1{display:flex;gap:8px;align-items:baseline}
.rec .l1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .l3{font-size:13px;margin-top:4px;color:var(--ink);opacity:.9}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}

/* ---------- form ---------- */
.fhd{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.ib{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.ft{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ft b{font-size:17px}.ft small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--sky);border-radius:3px;transition:width .2s}
.steps .st{flex:0 0 auto;font-size:13px;border-radius:999px;padding:7px 12px;background:var(--s2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.steps .st.on{color:var(--on);background:var(--sky);border-color:var(--sky);font-weight:700}
.steps .st.err{border-color:var(--verm);color:var(--ink)}
.steps .st.err::after{content:" !";color:var(--verm);font-weight:700}
.steps .st.on.err::after{color:var(--on)}
.sech{margin:0 0 14px;font-size:20px;font-weight:700}
.fld.hid{display:none}
.req{color:var(--orange)}
.ferr{color:var(--verm);font-size:13px;font-weight:700;margin-top:6px}
.ferr:empty{display:none}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--verm)}
.fld.bad .pills{outline:1px dashed var(--verm);outline-offset:4px;border-radius:10px}
.chosen{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chosen .chip{background:var(--yellow);color:var(--on)}
.cbox{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;max-height:360px;overflow:auto;background:var(--bg)}
.cgrp>.gh{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.qty{display:flex;flex-direction:column}
.qty div{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.qty input{padding:9px 10px;text-align:center}
.doses{display:grid;grid-template-columns:1fr;gap:10px}
.dose{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--s2)}
.dose b{font-size:14.5px}
.dose b::before{content:"○ ";color:var(--faint)}
.dose.has{border-color:var(--green)}
.dose.has b::before{content:"● ";color:var(--green)}
.dose input[type=date]{grid-column:1/-1;background:var(--bg)}
.dose .o{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dose .o input{width:20px;height:20px;accent-color:var(--sky);appearance:auto;-webkit-appearance:checkbox;padding:0}
.dose select{padding:8px 32px 8px 10px;font-size:14px;width:auto}
.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:25;display:flex;gap:10px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,17,23,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:11.5px;font-weight:700}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--sky)}
.bnav button.on span{font-weight:700}

/* ---------- reports ---------- */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:14px;margin:8px 0}
.kv div span{display:block;font-size:11.5px;color:var(--muted)}
.rtitle{font-size:17px;font-weight:700;line-height:1.3}
details.box{border-top:1px solid var(--line2);margin-top:10px;padding-top:8px}
details.box summary{cursor:pointer;color:var(--sky);font-weight:700;list-style:none;padding:6px 0}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:" ▾"}
.note{border-left:4px solid var(--orange);background:rgba(230,159,0,.1);padding:10px 12px;border-radius:10px;font-size:13.5px;margin:0 0 14px}
.tbar{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.tbar .seg{margin:0;flex:1}
.tog{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex:0 0 auto}
.tog input{width:20px;height:20px;accent-color:var(--sky);appearance:auto;-webkit-appearance:checkbox;padding:0}
.tsec{margin:18px 2px 8px}
.tsec h2{margin:0;font-size:16px;font-weight:700}
.tsec small{color:var(--muted)}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:14px 4px 6px}
.ilist{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ind{border-bottom:1px solid var(--line2)}
.ind:last-child{border-bottom:0}
.ind>summary,.ind>.sum0{display:flex;align-items:center;gap:10px;padding:12px 14px;list-style:none;cursor:pointer}
.ind>summary::-webkit-details-marker{display:none}
.ind .il{flex:1;min-width:0;font-size:14px;line-height:1.35}
.ind .il small{display:block;color:var(--muted);font-size:12.5px}
.cnt{min-width:38px;text-align:center;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--sky);color:var(--on)}
.cnt.z{background:transparent;color:var(--faint);border:1px solid var(--line)}
.dth{font-size:12px;font-weight:700;color:var(--verm);white-space:nowrap}
.ind[open]>summary{background:var(--s2)}
.bd{padding:4px 14px 12px;background:var(--s2)}
.bl{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.bl:last-child{border-bottom:0}
.bl b{color:var(--sky)}
.bl.d b{color:var(--verm)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--s1);max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line2);padding:6px 6px;text-align:center;white-space:nowrap}
.sum thead{position:sticky;top:0;z-index:3}
.sum thead th{background:var(--s3);color:var(--ink);font-weight:700}
.sum td.lb,.sum th.lb{position:sticky;left:0;z-index:2;background:var(--s1);text-align:left;white-space:normal;min-width:170px;max-width:170px;font-size:12.5px}
.sum thead th.lb{z-index:4;background:var(--s3)}
.sum td.lb small{display:block;color:var(--muted)}
.sum tr.sr td{background:var(--bg);color:var(--orange);font-weight:700;text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.sum td.z{color:var(--faint)}
.sum td.n{color:var(--on);background:var(--sky);font-weight:700;cursor:pointer}
.sum td.n.d{background:var(--verm)}

/* ---------- dictionary ---------- */
.dr{padding:12px 14px;border-bottom:1px solid var(--line2)}
.dr:last-child{border-bottom:0}
.dr .t{font-weight:700;font-size:14px}
.dr .t small{color:var(--muted);font-weight:400}
.dr .r{font-size:13px;color:var(--ink);opacity:.92;margin-top:4px}
.dr .v{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.vc{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;border-radius:6px;padding:2px 7px;background:var(--s3);color:var(--yellow)}
.dim{background:rgba(86,180,233,.08);border:1px solid rgba(86,180,233,.35);border-radius:14px;padding:12px 14px;font-size:13px;margin:0 0 10px}
.dim b{color:var(--sky)}
details.reg{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.reg>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
details.reg>summary::-webkit-details-marker{display:none}
details.reg[open]>summary{border-bottom:1px solid var(--line)}
.fs{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);padding:12px 14px 2px}
.feed{font-size:12px;border-radius:6px;padding:2px 7px;background:rgba(0,158,115,.16);color:#6fe0bf}
.feed.none{background:var(--s3);color:#CC79A7}

/* ---------- HF12 ---------- */
details.h12{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.h12>summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.h12>summary::-webkit-details-marker{display:none}
details.h12>summary::after{content:"▾";color:var(--muted)}
.hrow{padding:10px 14px;border-top:1px solid var(--line2)}
.hrow .hl{font-size:14px;margin-bottom:8px}
.hrow .hl small{display:block;color:var(--muted);font-size:12px}
.hg{display:grid;grid-template-columns:1fr;gap:10px}
.hg label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.hg input,.hg select{padding:9px 10px}
.hg .w{grid-column:1/-1}

/* ---------- more ---------- */
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line2)}
.mi:last-child{border-bottom:0}
.mi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s3);color:var(--sky);font-weight:700}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--sky);font-weight:700;margin:0 0 6px}

/* ---------- sheet & toast ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sbox{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.sbox::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.shd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shd b{flex:1;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--on);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


/* =========================================================
   DHIS2 blue theme (light). Text is dark navy or DHIS2 blue,
   never grey; any white text is bold. Register colours stay
   on the Okabe and Ito colour blind safe palette.
   ========================================================= */
body{font-weight:500}
h1,h2,.sech,.rtitle,.ph h1{color:var(--dhis3)}
.btn{background:var(--dhis2);color:#fff;font-weight:700;box-shadow:0 1px 2px rgba(13,71,161,.25)}

input,select,textarea{font-weight:500;background-color:#fff;border:1.5px solid var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--dhis2);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
::placeholder{color:var(--dhis2);opacity:.7;font-weight:500}
option,optgroup{background:#fff;color:var(--ink);font-weight:500}
select:disabled,input:disabled{color:var(--dhis2);background-color:var(--s2)}
:focus-visible{outline:2px solid var(--dhis2)}
.appbar{background:var(--dhis);border-bottom:0;box-shadow:0 2px 6px rgba(11,37,64,.18)}
.appbar .ctxbtn b,.appbar .ctxbtn small{color:#fff;font-weight:700}
.appbar .ctxbtn small{opacity:.95}
.logo{background:#fff;color:var(--dhis);font-weight:900}
.bnav{background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(11,37,64,.06)}

.fbar{background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(11,37,64,.06)}
.card,.ilist,.rec,.flt,details.reg,details.h12{box-shadow:0 1px 3px rgba(11,37,64,.06)}
.h,.fl>label,.fld>label{color:var(--dhis2)}
.pl{background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.pl.on{background:var(--dhis2);border-color:var(--dhis2);color:#fff;font-weight:700}
.multi .pl.on{background:#F0E442;border-color:#c9bd12;color:var(--ink);font-weight:700}
.chosen .chip{background:#F0E442;color:var(--ink);font-weight:700}
.seg{background:var(--s3);border-color:var(--line)}
.seg button{color:var(--dhis3)}

.prog{background:var(--s3)}.prog i{background:var(--dhis2)}
.steps .st{background:#fff;color:var(--dhis3)}

.req{color:var(--verm)}
.chip{background:var(--s3);color:var(--dhis3)}
.lnk{color:var(--dhis2);font-weight:700}
.back{color:var(--dhis2);font-weight:700}
/* landing */
.hero{border:0;background:radial-gradient(120% 90% at 100% 0%,rgba(86,180,233,.45),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(0,158,115,.35),transparent 60%),linear-gradient(150deg,#2c6693,#1565c0 55%,#0d47a1);box-shadow:0 6px 18px rgba(13,71,161,.25)}
.hero h1{color:#fff;font-weight:900}
.hero p{color:#fff;font-weight:700}
.eyebrow{color:#fff;font-weight:900}
.hero .hx circle{stroke:rgba(255,255,255,.22)}
.hero .pulse path{stroke:#fff}
.lh{color:var(--dhis3)}
.lh::after{background:linear-gradient(90deg,var(--dhis2),transparent)}
.rcard{box-shadow:0 2px 8px rgba(11,37,64,.08)}
.rcard .rt b{color:var(--ink)}
.rcard .rt small{color:var(--dhis3);font-weight:500}
.tg{background:#e3eef9;color:var(--dhis3);border:1px solid #9cc0e6;font-weight:700}
.tg.none{color:#8a3b6a;background:#f7e6f0;border-color:#e3b3cf}
/* reports & dictionary */
.grp,.fs{color:var(--dhis3)}
.ind>summary:hover{background:var(--s2)}
.ind[open]>summary{background:var(--s3)}
.bd{background:var(--s2)}
.bl b{color:var(--dhis2)}
.cnt{background:var(--dhis2);color:#fff}
.cnt.z{color:var(--dhis2);border-color:var(--line)}
.sum thead th{background:var(--dhis);color:#fff;font-weight:700}
.sum thead th.lb{background:var(--dhis3)}
.sum tr.sr td{background:var(--s3);color:var(--dhis3)}
.sum td.n{background:var(--dhis2);color:#fff}
.sum td.n.d{background:var(--verm);color:#fff}
.vc{background:#e3eef9;color:var(--dhis3)}
.feed{background:#dff3ec;color:#00664a;font-weight:700}
.feed.none{background:#f7e6f0;color:#8a3b6a}
.dim{background:#eaf2fb;border-color:#9cc0e6}
.dim b{color:var(--dhis3)}
.note{background:#fff4dc;border-left-color:#E69F00;color:var(--ink)}
.flt .fi,.mi .ic{background:#e3eef9;color:var(--dhis2)}
.toast{background:var(--dhis3);color:#fff;font-weight:700}
.sbox{background:#fff}
.dose{background:#fff}
details.box summary{color:var(--dhis2);font-weight:700}
.tog{color:var(--dhis3)}
.tog input,.dose .o input{accent-color:var(--dhis2)}
.dose.has{background:#eaf7f2}
.cbox{background:var(--s2)}

/* header and footer joined by one thick frame line (Okabe and Ito bluish green) */
:root{--frame:#009E73}
.mohlogo{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:contain;flex:0 0 auto;box-shadow:0 0 0 2px #fff}
.appbar{border-bottom:6px solid var(--frame)}
.bnav,.fbar{border-top:6px solid var(--frame)}
.frame{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);border-left:6px solid var(--frame);border-right:6px solid var(--frame);pointer-events:none;z-index:15}
main{padding-left:18px;padding-right:18px}
.lh:first-child{margin-top:8px}

/* header at twice the height */
.appbar{padding:20px 18px;gap:16px}
.mohlogo{width:88px;height:88px;box-shadow:0 0 0 3px #fff}
.appbar .ctxbtn b{font-size:24px;line-height:1.2}
.appbar .ctxbtn small{font-size:15px;margin-top:4px;white-space:normal;overflow:visible}

/* menu button at the top right, opening a drop down menu */
.menubtn{position:relative;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);border:2px solid #fff;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menubtn span{display:block;width:24px;height:3px;border-radius:2px;background:#fff;transition:transform .2s ease,opacity .2s ease}
.menubtn.open span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.menubtn.open span:nth-child(2){opacity:0}
.menubtn.open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.appbar .bnav{position:absolute;top:calc(100% + 6px);right:12px;left:auto;bottom:auto;transform:none;width:250px;display:none;flex-direction:column;gap:2px;padding:8px;
  background:#fff;border:0;border-radius:18px;box-shadow:0 12px 32px rgba(11,37,64,.28);outline:3px solid var(--frame);z-index:30}
.appbar .bnav.open{display:flex;animation:drop .16s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.appbar .bnav button{flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 14px;border-radius:12px;font-size:16px;font-weight:700;color:var(--ink)}
.appbar .bnav button:hover{background:var(--s2)}
.appbar .bnav button.on{background:#e3eef9;color:var(--dhis2)}
.appbar .bnav svg{width:24px;height:24px}
/* slim footer that closes the green frame */
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:20;background:var(--dhis);color:#fff;font-weight:700;font-size:13px;text-align:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--frame)}
.app{padding-bottom:70px}
.toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* images shown clean: no shading over the picture and no shadow around it */
.rcard,.rcard:hover{box-shadow:none}
.rcard .pic::after{display:none}
.rcard .age{box-shadow:none}
.rcard .art{filter:none}

/* age label sits in its own band under the picture, never over it */
.rcard .age{position:static;align-self:flex-start;margin:12px 14px 0;padding:6px 14px;font-size:14px}
.rcard .rbody{padding-top:10px}

.foot{font-size:clamp(8.5px,2.85vw,13px);white-space:nowrap;padding-left:8px;padding-right:8px}
.foot .sep{margin:0 .45em}

/* =========================================================
   Responsive layout: phone, tablet and laptop.
   One width token drives the app column, the frame line,
   the footer and the form action bar so they always line up.
   ========================================================= */
:root{--appw:560px}
@media (min-width:700px){ :root{--appw:820px} }
@media (min-width:1100px){ :root{--appw:1200px} }
.app{max-width:var(--appw)}
.frame,.foot,.fbar{width:min(var(--appw),100%)}
/* register cards: one column on phones, two on tablets, three on laptops */
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px} main{padding-left:24px;padding-right:24px} }
@media (min-width:1100px){ .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px} main{padding-left:32px;padding-right:32px} }
.rcard{height:100%}
.rcard .rbody{flex:1}
/* forms stay at a comfortable reading width, one question per row */
@media (min-width:700px){
  body[data-view="form"] main{max-width:760px;margin:0 auto}
  .fbar{justify-content:center}
  .fbar .btn{max-width:280px}
}
/* records: cards side by side on bigger screens */
@media (min-width:1100px){
  #rl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #rl .rec{margin:0}
  #rl .empty{grid-column:1/-1}
}
/* reports and dictionary: wider screens show more of the table and header */
@media (min-width:700px){
  .kv{grid-template-columns:repeat(3,1fr)}
  .tw{max-height:70vh}
  .sum td.lb,.sum th.lb{min-width:240px;max-width:240px}
  body[data-view="dict"] main,body[data-view="hf12"] main,body[data-view="backup"] main,body[data-view="more"] main{max-width:900px;margin:0 auto}
}
@media (min-width:1100px){ .kv{grid-template-columns:repeat(6,1fr)} }
/* bottom sheets become centred dialogs on tablets and laptops */
@media (min-width:700px){
  .sheet{align-items:center;padding:24px}
  .sbox{width:min(600px,100%);border-radius:22px;border-bottom:1px solid var(--line);max-height:84vh}
  .sbox::before{display:none}
}
/* header scales a little on small phones */
@media (max-width:360px){
  .mohlogo{width:70px;height:70px}
  .appbar .ctxbtn b{font-size:20px}
  .appbar .ctxbtn small{font-size:13px}
  .menubtn{width:46px;height:46px}
}
/* short landscape phones: keep the header compact */
@media (max-height:500px) and (orientation:landscape){
  .appbar{padding:8px 16px}
  .mohlogo{width:48px;height:48px}
  .appbar .ctxbtn b{font-size:18px}
}
img,svg{max-width:100%}

/* one question per page: the question is the heading, long answer lists scroll inside the card */
.qmeta{display:flex;justify-content:space-between;gap:10px;margin:2px 2px 10px;font-size:13.5px;font-weight:700;color:var(--dhis2)}
.qcard{max-height:calc(100dvh - 380px);min-height:180px;overflow:auto;margin-bottom:96px;padding:20px}
.qcard .fld>label{font-size:21px;line-height:1.3;font-weight:900;color:var(--dhis3);margin-bottom:14px}
.qcard .fld+.fld>label{font-size:14px;font-weight:700;color:var(--dhis2);margin-bottom:6px}
.qcard .cbox{max-height:none}
.qcard .pl{min-height:46px;padding:11px 16px;font-size:15px}
.ib.del{color:var(--verm);border-color:var(--verm)}
@media (min-width:700px){ .qcard{max-height:calc(100dvh - 400px)} }
@media (max-height:500px) and (orientation:landscape){ .qcard{max-height:calc(100dvh - 250px)} }

/* the form view is exactly one screen tall: nothing but a long answer box can scroll */
body[data-view="form"] .app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:0;min-height:0}
body[data-view="form"] main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));width:100%}
body[data-view="form"] .qcard{flex:0 1 auto;min-height:0;max-height:none;margin-bottom:0}
body[data-view="form"] .fhd,body[data-view="form"] .prog,body[data-view="form"] .qmeta{flex:0 0 auto}

/* radio buttons (Session): one option per row, a circle that fills when chosen */
.pills.radios{flex-direction:column;gap:10px}
.pills.radios .pl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:14px;padding:14px 16px;min-height:56px;font-size:17px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--line)}
.pills.radios .rdot{width:24px;height:24px;border-radius:50%;border:3px solid var(--dhis2);flex:0 0 auto;display:grid;place-items:center;background:#fff}
.pills.radios .pl.on{background:#e3eef9;border-color:var(--dhis2);color:var(--dhis3)}
.pills.radios .pl.on .rdot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--dhis2)}

.ft small b.regno{color:var(--dhis3);font-weight:900;font-size:inherit}
.ft small{white-space:normal}

/* checkboxes for "tick all that apply": one per row, square box with a tick */
.pills.checks{flex-direction:column;gap:10px}
.pills.checks .pl,.multi .pills.checks .pl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:14px;padding:13px 16px;min-height:54px;font-size:16px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--line)}
.pills.checks .pl::before{content:none}
.pills.checks .cbx{width:24px;height:24px;border-radius:6px;border:3px solid var(--dhis2);flex:0 0 auto;display:grid;place-items:center;background:#fff}
.pills.checks .pl.on,.multi .pills.checks .pl.on{background:#e3eef9;border-color:var(--dhis2);color:var(--dhis3)}
.pills.checks .pl.on .cbx{background:var(--dhis2)}
.pills.checks .pl.on .cbx::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chosen .chip{background:#e3eef9;color:var(--dhis3);border:1px solid #9cc0e6}

/* footer on two lines: ministry above, ICF-SL credit below */
.foot{display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.foot .f1{font-size:clamp(10px,3.1vw,14px)}
.foot .f2{font-size:clamp(10.5px,3vw,12.5px);white-space:normal;text-align:center;line-height:1.35;max-width:100%}
.app{padding-bottom:104px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* each picture keeps its own shape so nothing is cropped (0-2 months image is 3:2) */
.rcard[data-reg="yi"] .pic{aspect-ratio:3/2}
.rcard .art{object-position:center top}
@media print{
  .foot,.menubtn{display:none!important}
  .frame{display:none!important}
  .appbar,.bnav,.fbar,.seg,.tbar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .app{max-width:none;padding:0}
  .card,.ilist{border:1px solid #999;background:#fff;color:#000}
  .tw{max-height:none;overflow:visible;border:0;background:#fff}

}

const pd = s => { if (!s) return null; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
function recDate(r){ return r.data[REG[r.reg].dateF] || ''; }
function ageDays(r){
  const d = r.data;
  switch (r.reg){
    case 'yi': return +d.ageDays;
    case 'ch': return +d.ageMonths * MD;
    case 'gen': return +d.ageYears * YD;
    case 'ipc': return d.ageUnit === 'Years' ? +d.age * YD : +d.age * MD;
    case 'ipa': return +d.age * YD;
    case 'u2': return d.dob && d.firstContact ? daysBetween(d.dob, d.firstContact) : NaN;
    case 'td': return d.dob && d.regDate ? daysBetween(d.dob, d.regDate) : NaN;
  }
  return NaN;
}
function ageText(r){
  const d = r.data;
  switch (r.reg){
    case 'yi': return d.ageDays + ' d';
    case 'ch': return d.ageMonths + ' m';
    case 'gen': return d.ageYears + ' y';
    case 'ipc': return d.age + (d.ageUnit === 'Years' ? ' y' : ' m');
    case 'ipa': return d.age + ' y';
    case 'u2': { const a = ageDays(r); return isNaN(a) ? '' : Math.floor(a / MD) + ' m'; }
    case 'td': { const a = ageDays(r); return isNaN(a) ? '' : Math.floor(a / YD) + ' y'; }
  }
  return '';
}
const inPeriod = (s, c) => { const d = pd(s); return !!d && d.getFullYear() === +c.year && d.getMonth() + 1 === +c.month; };
const atFacility = (r, c) => r.ctx && r.ctx.district === c.district && r.ctx.facility === c.facility;
const isOPD = r => r.reg === 'yi' || r.reg === 'ch' || r.reg === 'gen';
const isIP = r => r.reg === 'ipc' || r.reg === 'ipa';

/* HF1 keys from an OPD record: structured fields fill the malaria, ARI,
   pneumonia, diarrhoea and disability rows, ticked classifications fill the rest */
function hf1Keys(r){
  const d = r.data, s = new Set();
  if (d.fever === 'Yes') s.add('mal_fev');
  if (d.rdt === 'Positive') s.add('mal_rdt_p'); if (d.rdt === 'Negative') s.add('mal_rdt_n');
  if (d.micro === 'Positive') s.add('mal_mic_p'); if (d.micro === 'Negative') s.add('mal_mic_n');
  const tm = d.malTiming === 'After 24 hrs of onset' ? 'g' : 'l';
  if (d.malTx === 'ACT') s.add('mal_act_' + tm);
  if (d.malTx === 'Other antimalarial') s.add('mal_oth_' + tm);
  if (d.malTx === MALTX[3]) s.add('mal_sev_' + tm);
  const pn = { 'ARI: cough or cold':'ari', 'Pneumonia: Amoxicillin':'pn_amx', 'Pneumonia: other antibiotic':'pn_oth', 'Severe pneumonia: Oxygen therapy':'pn_sev' }[d.pnTx];
  if (pn) s.add(pn);
  if (d.diaClass === 'Diarrhoea with blood') s.add('dia_bl');
  if (d.diaClass === 'Watery: ORS & Zinc') s.add('dia_wat');
  if (d.diaClass === 'Severe dehydration: IV fluid') s.add('dia_iv');
  if (isDisabled(r)){
    const m = { Physical:'dis_phy', Visual:'dis_vis', Hearing:'dis_hear', Speech:'dis_speech', Multiple:'dis_mult', Learning:'nd_learn' }[d.disType];
    if (m) s.add(m);
  }
  (d.conds || []).forEach(k => s.add(k));
  return s;
}
function hf6Keys(r){
  const d = r.data, s = new Set();
  if (d.principal) s.add(d.principal);
  (d.additional || []).forEach(k => s.add(k));
  (d.disab || []).forEach(x => {
    const k = /^Physical/.test(x) ? 'h_dis_phy' : /^Visual/.test(x) ? 'h_dis_vis' : /^Hearing/.test(x) ? 'h_dis_hear'
      : /^Speech/.test(x) ? 'h_dis_speech' : /^Multiple/.test(x) ? 'h_dis_mult' : /^Learning/.test(x) ? 'h_dis_int' : 'h_dis_oth';
    s.add(k);
  });
  return s;
}
function isDisabled(r){
  const d = r.data;
  if (r.reg === 'ch') return d.disab === 'Yes';
  if (r.reg === 'gen') return (d.cats || []).includes('Disability');
  if (isIP(r)) return (d.disab || []).length > 0;
  return false;
}
const isDead = r => r.data.outcome === 'Died' || r.data.outcome === 'Death';
const isReferred = r => isIP(r) ? r.data.outcome === 'Transferred' : r.data.referred === 'Yes';
function recKeys(r){ return isOPD(r) ? hf1Keys(r) : isIP(r) ? hf6Keys(r) : new Set(); }
function recSummary(r){
  const d = r.data;
  if (r.reg === 'u2' || r.reg === 'td'){
    const list = (r.reg === 'u2' ? U2_DOSES : TD_DOSES).filter(x => d.doses && d.doses[x[0]] && d.doses[x[0]].date).map(x => x[1]);
    return list.length ? list.slice(-4).join(', ') + (list.length > 4 ? ' (+' + (list.length - 4) + ')' : '') : 'No dose recorded';
  }
  const k = [...recKeys(r)].map(x => LABEL[x] || x);
  return k.length ? k.slice(0, 3).join('; ') + (k.length > 3 ? ' (+' + (k.length - 3) + ')' : '') : '';
}


let SUM = 'HF1', TABLES = [];
const add = (data, row, col, id) => { ((data[row] = data[row] || {})[col] = data[row][col] || []).push(id); };
function ageGroup(groups, days){ for (let i = 0; i < groups.length; i++) if (days < groups[i][1]) return i; return -1; }
const G_HF1 = [['0-7 Days',8],['8-28 Days',29],['1-5 Months',6*MD],['6-11 Months',YD],['12-23 Months',2*YD],['24-59 Months',5*YD],['5-9 Yrs',10*YD],['10-14 Yrs',15*YD],['15-19 Yrs',20*YD],['20-24 Yrs',25*YD],['25-34 Yrs',35*YD],['35-49 Yrs',50*YD],['50-59 Yrs',60*YD],['60+ Yrs',1e9]];
const G_HF6 = [['0-7 Days',8],['8-28 Days',29],['1-11 Months',YD],['12-59 Months',5*YD],['5-9 Yrs',10*YD],['10-14 Yrs',15*YD],['15-19 Yrs',20*YD],['20-24 Yrs',25*YD],['25-34 Yrs',35*YD],['35-49 Yrs',50*YD],['50-64 Yrs',65*YD],['65+ Yrs',1e9]];

const SEXES = ['M','F'];

function morbidityTable(id, title, rows, groups, recsCase, recsDeath, keysFn, extra){
  const data = {}, cols = [], heads = [[['Age group', 0]], [], []];
  groups.forEach((g, i) => { heads[0].push([g[0], 4]); heads[1].push(['Cases', 2], ['Deaths', 2]); heads[2].push(['M',1],['F',1],['M',1],['F',1]); cols.push('C'+i+'M','C'+i+'F','D'+i+'M','D'+i+'F'); });
  if (extra.total){ heads[0].push(['Total for all ages', 4]); heads[1].push(['Cases', 2], ['Deaths', 2]); heads[2].push(['M',1],['F',1],['M',1],['F',1]); cols.push('TCM','TCF','TDM','TDF'); }
  heads[0].push(['Disability', 2]); heads[1].push(['Cases', 2]); heads[2].push(['M',1],['F',1]); cols.push('DISM','DISF');
  if (extra.referral){ heads[0].push(['Referral', 4]); heads[1].push(['< 5 Years', 2], ['> 5 Years', 2]); heads[2].push(['M',1],['F',1],['M',1],['F',1]); cols.push('RUM','RUF','ROM','ROF'); }
  recsCase.forEach(r => {
    const sx = r.data.sex, gi = ageGroup(groups, ageDays(r)); if (gi < 0 || !SEXES.includes(sx)) return;
    keysFn(r).forEach(k => {
      add(data, k, 'C' + gi + sx, r.id); if (extra.total) add(data, k, 'TC' + sx, r.id);
      if (isDisabled(r)) add(data, k, 'DIS' + sx, r.id);
      if (extra.referral && isReferred(r)) add(data, k, (ageDays(r) < 5 * YD ? 'RU' : 'RO') + sx, r.id);
    });
  });
  recsDeath.forEach(r => {
    const sx = r.data.sex, gi = ageGroup(groups, ageDays(r)); if (gi < 0 || !SEXES.includes(sx)) return;
    keysFn(r).forEach(k => { add(data, k, 'D' + gi + sx, r.id); if (extra.total) add(data, k, 'TD' + sx, r.id); });
  });
  return { id, title, heads, cols, rows, data, deathCols: new Set(cols.filter(c => /^D\d/.test(c) || /^TD/.test(c))) };
}
function attendanceTable(id, title, rows, groups, recs, tests){
  const data = {}, cols = [], heads = [[['Age group', 0]], []];
  groups.forEach((g, i) => { heads[0].push([g[0], 2]); heads[1].push(['M',1],['F',1]); cols.push(i+'M', i+'F'); });
  heads[0].push(['Total', 2]); heads[1].push(['M',1],['F',1]); cols.push('TM','TF');
  recs.forEach(r => { const sx = r.data.sex, gi = ageGroup(groups, ageDays(r)); if (gi < 0 || !SEXES.includes(sx)) return;
    rows.forEach(row => { if (tests[row[0]](r)){ add(data, row[0], gi + sx, r.id); add(data, row[0], 'T' + sx, r.id); } }); });
  return { id, title, heads, cols, rows, data };
}

function buildHF1(c){
  const opd = facRecs().filter(r => isOPD(r) && inPeriod(recDate(r), c));
  const t1 = morbidityTable('hf1m', 'Facility morbidity cases (PHU registers: IMNCI, Under fives and General)', HF1, G_HF1, opd, opd.filter(isDead), hf1Keys, { referral:true });
  const rows = [['opd','Attendance','Total OPD (new and follow-up cases)',''],['new','Attendance','New cases',''],['fu','Attendance','Follow-up cases',''],['ref','Attendance','Total number referred',''],['dis','Attendance','Total number with disability',''],['fhc','Attendance','Free Health Care',''],['preg','Special groups','No. of pregnant women treated',''],['lact','Special groups','No. of lactating mothers treated',''],['evd','Special groups','No. of EVD survivors treated',''],['u5','Special groups','No. of children under 5 yrs treated','']];
  const t2 = attendanceTable('hf1a', 'Attendance and special groups', rows, G_HF1, opd, {
    opd: () => true, new: r => r.data.visit !== 'Follow-up', fu: r => r.data.visit === 'Follow-up', ref: isReferred, dis: isDisabled,
    fhc: r => r.reg !== 'gen' || r.data.pay === 'Free Health Care' || (r.data.cats || []).some(x => x === 'Pregnant' || x === 'Lactating'),
    preg: r => (r.data.cats || []).includes('Pregnant'), lact: r => (r.data.cats || []).includes('Lactating'), evd: r => (r.data.cats || []).includes('EVD survivor'), u5: r => ageDays(r) < 5 * YD });
  return { title:'Monthly Summary Out-Patient Morbidity Form, PHU · HF1', from:'Young infant (0-2 m), Under five (2-59 m) and General (5+) registers', tables:[t1, t2],
    note: opd.length ? '' : 'No OPD consultation is recorded for this facility and month.' };
}

  const imam = Object.assign({ id:'hf2m', title:'Integrated Management of Acute Malnutrition (IMAM): children identified', rows:[['sam','IMAM','Child identified with SAM',''],['mam','IMAM','Child identified with MAM','']], data:{} }, imamHeads);
  const screen = (r, date, dob, days, out) => {
    const d = r.data, sx = d.sex; if (!SEXES.includes(sx)) return;
    const gi = ageGroup(G_NUT, days); if (gi < 0) return;
    const col = (out ? 'O' : 'F') + gi + sx, a = (row) => add(nut.data, row, col, r.id);
    const z = v => v === ZC[0] ? 'n' : v === ZC[1] ? 'm' : v === ZC[2] ? 's' : '';
    if (z(d.waz)){ a('s_waz'); a('waz_' + z(d.waz)); }
    if (z(d.whz)){ a('s_whz'); a('whz_' + z(d.whz)); }
    const mu = d.muac === '' || d.muac == null ? NaN : +d.muac;
    if (!isNaN(mu)){ a('s_muac'); a(mu < 11.5 ? 'muac_r' : mu < 12.5 ? 'muac_y' : 'muac_g'); }
    const oe = d.oedema && d.oedema !== '0';
    if (oe) a('oed');
    const b = (row, crit) => add(imam.data, row, crit + gi + sx, r.id);
    if (z(d.whz) === 's') b('sam','W'); if (z(d.whz) === 'm') b('mam','W');
    if (!isNaN(mu) && mu < 11.5) b('sam','U'); if (!isNaN(mu) && mu >= 11.5 && mu < 12.5) b('mam','U');
    if (oe) b('sam','E');

  u2.filter(r => inPeriod(r.data.firstContact, c)).forEach(r => screen(r, r.data.firstContact, r.data.dob, daysBetween(r.data.dob, r.data.firstContact), r.data.setting === 'Outreach'));

    note:'COVID-19 vaccinations and OTP/SFP admissions and discharges come from registers that are not in this EMR, so they are left off.' };
}

function fieldError(f, d){

  if (f.t === 'num' && v != null && v !== ''){ const n = +v; if (isNaN(n)) return 'Numbers only'; if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) return 'Enter ' + f.min + ' to ' + f.max; }

        const dim = DIMS.find(d => d.tbl === tid);
        const rows = t.rows.map(row => ({ row, rule: RULES.find(r => r.tbl === tid && r.key === row[0]) }))
          .filter(x => !q || (x.row[2] + ' ' + x.row[3] + ' ' + x.rule.rule + ' ' + x.rule.vars.join(' ') + ' ' + form).toLowerCase().includes(q));
        if (!rows.length) return;
        h += '<div class="tsec"><h2>' + form + ' · ' + esc(t.title) + '</h2></div>' +
          (dim ? '<div class="dim"><b>Breakdown columns.</b> ' + esc(dim.text) + '</div>' : '') +
          '<div class="ilist">' + rows.map(({ row, rule }) =>
            '<div class="dr"><div class="t">' + esc(row[2]) + (row[3] ? ' <small>· ' + esc(row[3]) + '</small>' : '') + '</div>' +
            '<div class="r">' + esc(rule.rule) + '</div>' +
            '<div class="v">' + rule.regs.map(k => badge(k, true)).join('') + rule.vars.map(v => '<span class="vc">' + esc(v) + '</span>').join('') + '</div></div>').join('') + '</div>';
      });
    });
    el.innerHTML = h || '<div class="empty">Nothing matches.</div>';
  } else {
    el.innerHTML = VIS.map(k => {
      const R = REG[k];
      const secs = R.sections.map(s => [s[0], s[1].filter(f => !q || (f.id + ' ' + f.l).toLowerCase().includes(q))]).filter(s => s[1].length);
      if (!secs.length) return '';
      return '<details class="reg"' + (q ? ' open' : '') + '><summary>' + badge(k) + '<span class="rt"><b>' + esc(R.title) + '</b><small>' + allFields(k).length + ' variables · ' + (R.feeds.length ? 'feeds ' + R.feeds.join(', ') : 'recorded only, no summary form') + '</small></span><span class="chev">▾</span></summary>' +
        secs.map(s => '<div class="fs">' + esc(s[0]) + '</div>' + s[1].map(f => {
          const fd = feedsOf(k, f.id);
          return '<div class="dr"><div class="t"><span class="vc">' + esc(f.id) + '</span> ' + esc(f.l) + (f.req ? ' <small>· required</small>' : '') + '</div>' +
            '<div class="r muted">' + esc(TYPE_NAME[f.t]) + (optText(f) ? ': ' + esc(optText(f)) : '') + '</div>' +
            '<div class="v">' + (fd.length ? fd.map(x => '<span class="feed">' + esc(x) + '</span>').join('') : '<span class="feed none">Recorded only</span>') + '</div></div>';
        }).join('')).join('') + '</details>';
    }).join('') || '<div class="empty">Nothing matches.</div>';
  }
}
function dictCSV1(){
  const lines = [['Summary form','Table','Section','Indicator','Detail','Registers','Variables','Counting rule','Breakdown columns'].map(csvQ).join(',')];
  RULES.forEach(r => { const t = TBLINFO[r.tbl], row = t.rows.find(x => x[0] === r.key), d = DIMS.find(x => x.tbl === r.tbl);
    lines.push([r.form, t.title, row[1], row[2], row[3], r.regs.map(k => REG[k].title).join('; '), r.vars.join('; '), r.rule, d ? d.text : ''].map(csvQ).join(',')); });
  download('PHU_EMR_summary_form_links.csv', lines.join('\n'), 'text/csv');
}
function dictCSV2(){
  const lines = [['Register','Section','Variable','Label','Type','Options','Required','Feeds'].map(csvQ).join(',')];
  VIS.forEach(k => REG[k].sections.forEach(s => s[1].forEach(f =>
    lines.push([REG[k].title, s[0], f.id, f.l, TYPE_NAME[f.t], optText(f), f.req ? 'Yes' : '', feedsOf(k, f.id).join('; ') || 'Recorded only'].map(csvQ).join(',')))));
  download('PHU_EMR_register_variables.csv', lines.join('\n'), 'text/csv');
}

/* ===================== HF12 ===================== */
function vHF12(m){
  if (!ctxReady()){ needCtx(m, 'HF12'); return; }
  const v = DB.hf12[h12Key()] || {}, c = C();
  m.innerHTML = '<button class="back" id="bk">‹ More</button><div class="ph"><h1>HF12</h1></div>' + filterBar() +
    '<div class="card"><div class="rtitle">Semi-permanent data reporting form</div><p class="muted sm" style="margin:6px 0 0">Facility profile for ' + esc(c.facility) + ', ' + MONTHS[c.month - 1] + ' ' + c.year + '. It is entered here directly and saves as you type.</p><p class="sm" id="h12s" style="margin:8px 0 0;color:var(--green)">' + Object.keys(v).length + ' entries saved</p></div>' +
    HF12.map(s => {
      const filled = Object.keys(v).filter(k => k.startsWith(s.id + '|')).length;
      return '<details class="h12"><summary><span>' + esc(s.title) + '</span><span class="muted sm" style="margin-left:auto;margin-right:10px">' + filled + ' filled</span></summary>' +
        s.rows.map((r, i) => '<div class="hrow"><div class="hl">' + esc(r[1]) + (r[0] ? '<small>' + esc(r[0]) + '</small>' : '') + '</div><div class="hg">' + s.cols.map(cn => {
          const k = s.id + '|' + i + '|' + cn[0], val = v[k] == null ? '' : v[k], type = s.t === 'mix' ? (cn[0] === 'yn' ? 'yn' : 'text') : s.t;
          return '<div class="' + (type === 'text' ? 'w' : '') + '"><label>' + esc(cn[1]) + '</label>' + (type === 'yn'
            ? '<select data-h="' + k + '">' + opts(['Yes','No'], val, '') + '</select>'
            : '<input data-h="' + k + '" ' + (type === 'num' ? 'type="number" min="0" step="1" inputmode="numeric"' : '') + ' value="' + esc(val) + '">') + '</div>';
        }).join('') + '</div></div>').join('') + '</details>';
    }).join('');
  $('#bk').onclick = () => go('more'); bindFilter();
  $$('#main [data-h]').forEach(el => el[el.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => {
    const key = h12Key(), o = DB.hf12[key] = DB.hf12[key] || {};
    if (el.value === '') delete o[el.dataset.h]; else o[el.dataset.h] = el.value;
    save(); $('#h12s').textContent = Object.keys(o).length + ' entries saved';
  });
}

/* ===================== MORE & BACKUP ===================== */
function vMore(m){
  const item = (id, ic, t, s) => '<button class="mi" data-go="' + id + '"><span class="ic">' + ic + '</span><span class="rt"><b>' + t + '</b><small>' + s + '</small></span><span class="chev">›</span></button>';
  m.innerHTML = '<div class="ph"><h1>More</h1></div><div class="card" style="padding-top:4px;padding-bottom:4px">' +
    item('hf12', '12', 'HF12 facility profile', 'Staff, equipment, infrastructure and utilities') +
    item('ctx', '⌖', 'Records and reports filter', 'District, chiefdom, PHU, facility type, month and year') +
    item('backup', '⇅', 'Backup and restore', 'Keep a copy of the records or move them to another device') + '</div>' +
    '<p class="muted sm" style="margin:0 4px 16px">Records are stored on this device. Download a backup regularly.</p>';
  $$('#main [data-go]').forEach(b => b.onclick = () => b.dataset.go === 'ctx' ? openCtx() : go(b.dataset.go));
}
function vBackup(m){
  const by = REG_KEYS.map(k => REG[k].code + ' ' + DB.recs.filter(r => r.reg === k).length).join(' · ');
  m.innerHTML = '<button class="back" id="bk">‹ More</button><div class="ph"><h1>Backup</h1></div>' +
    '<div class="card"><p style="margin-top:0">All records are kept in this browser on this device. Download a backup regularly, and restore it on another device to carry the records across.</p>' +
    '<p class="muted sm">' + DB.recs.length + ' records on this device (' + esc(by) + ').</p><div class="stack">' +
    '<button class="btn" id="bx">Download backup</button><label class="btn sec" style="cursor:pointer">Restore from backup<input type="file" id="bi" accept=".json,application/json" hidden></label>' +
    '<button class="btn danger" id="bc">Delete all records</button></div></div>';
  $('#bk').onclick = () => go('more');
  $('#bx').onclick = () => download('phu_emr_backup_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(DB), 'application/json');
  $('#bi').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!Array.isArray(d.recs)) throw 0;
        const have = new Set(DB.recs.map(r => r.id)); let n = 0; d.recs.forEach(r => { if (!have.has(r.id)){ DB.recs.push(r); n++; } });
        Object.assign(DB.hf12, d.hf12 || {}); save(); toast(n + ' records restored'); vBackup(m);
      } catch(err){ toast('That file is not a PHU EMR backup'); } };
    rd.readAsText(f);
  };
  $('#bc').onclick = () => {
    sheet('<div class="shd"><b>Delete all records?</b></div><p class="muted">Every record and HF12 entry on this device will be removed. Download a backup first if you may need them.</p><div class="row"><button class="btn sec" id="dn">Cancel</button><button class="btn danger" id="dy">Delete everything</button></div>');
    $('#dn').onclick = () => closeSheet(true);
    $('#dy').onclick = () => { DB.recs = []; DB.hf12 = {}; save(); closeSheet(true); toast('All records deleted'); vBackup(m); };
  };
}

/* ===================== SHEET, DOWNLOAD, INIT ===================== */
function sheet(html){ $('#sbox').innerHTML = html; $('#sheet').classList.add('on'); $$('#sbox [data-close]').forEach(b => b.onclick = () => closeSheet()); }
function closeSheet(quiet){ $('#sheet').classList.remove('on'); if (!quiet) render(); }
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
load(); ctxDefaults();
function openMenu(){ $('#bnav').classList.add('open'); $('#menuBtn').classList.add('open'); $('#menuBtn').setAttribute('aria-expanded', 'true'); $('#menuBtn').setAttribute('aria-label', 'Close menu'); }
function closeMenu(){ $('#bnav').classList.remove('open'); $('#menuBtn').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); $('#menuBtn').setAttribute('aria-label', 'Open menu'); }
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#bnav').classList.contains('open') ? closeMenu() : openMenu(); };
$('#bnav').onclick = e => { const b = e.target.closest('button'); if (b){ closeMenu(); go(b.dataset.v); } };
document.addEventListener('click', e => { if (!e.target.closest('#bnav') && !e.target.closest('#menuBtn')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(VIEW === 'form'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(VIEW === 'form'); });
go('home');
</script>
